# @gzqdev/dsh-memory-starmap —— 把 dsh-memento 的记忆画成一张只读星图
#
# 这里是**基线配置**（启动时生效，改它要重启 DSH）。
# 两条路由都是只读的：/api/memory-starmap/graph 与 /api/memory-starmap/page。
# 本插件不注册模型工具、不注入上下文、不写记忆库。
- insert:
    - id: memory-starmap
      name: '@gzqdev/dsh-memory-starmap'
      config:
        # 兜底直读路径：只有「没装 dsh-memento 服务」时才会用到它。
        # 正常情况下走 memory 服务的 store.listEntries()（不改 recall_count）。
        # 例：'D:/gzq/Memory/dsh-memento.db'
        dbPath: ''

        # 一次最多吐多少条（页面节点数上限，防止几千条把画布塞满）
        entryLimit: 2000

        # 侧栏「审计轨迹」的数据源上限
        auditLimit: 400

        # 兜底直读时用的每层字符预算（dsh-memento 0.5.x 默认：user 2000 / agent 4000）
        budgetLimits:
          user: 2000
          agent: 4000
